[project]
name = "kribu-workspace"
version = "0.1.0"
description = "KRIBU Python workspace"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]
markers = [
    "integration: needs PostgreSQL and OPA; runs only with KRIBU_INTEGRATION=1",
]

