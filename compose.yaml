name: kribu

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kribu}
      POSTGRES_USER: ${POSTGRES_USER:-kribu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kribu_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kribu_postgres_data:/var/lib/postgresql
      - ./infra/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kribu} -d ${POSTGRES_DB:-kribu}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  db-bootstrap:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-kribu_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-kribu}
      POSTGRES_USER: ${POSTGRES_USER:-kribu}
      KRIBU_APP_DB_PASSWORD: ${KRIBU_APP_DB_PASSWORD:-kribu_app_dev_only}
    volumes:
      - ./infra/compose/postgres/bootstrap:/bootstrap:ro
    command: >-
      sh -c 'psql -v ON_ERROR_STOP=1
      -v app_user=kribu_app
      -v app_password="$${KRIBU_APP_DB_PASSWORD}"
      -v app_database="$${POSTGRES_DB}"
      -h postgres -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      -f /bootstrap/001_app_role.sql'
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      KRIBU_ENVIRONMENT: development
      KRIBU_DATABASE_URL: postgresql+asyncpg://kribu_app:${KRIBU_APP_DB_PASSWORD:-kribu_app_dev_only}@postgres:5432/${POSTGRES_DB:-kribu}
      KRIBU_MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kribu}:${POSTGRES_PASSWORD:-kribu_dev_only}@postgres:5432/${POSTGRES_DB:-kribu}
    command: ["uv", "run", "--frozen", "--no-dev", "alembic", "upgrade", "head"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      KRIBU_MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kribu}:${POSTGRES_PASSWORD:-kribu_dev_only}@postgres:5432/${POSTGRES_DB:-kribu}
    command: ["uv", "run", "--frozen", "--no-dev", "python", "-m", "scripts.seed_demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  keycloak-postgres:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_only}
    volumes:
      - kribu_keycloak_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d ${KEYCLOAK_DB:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kribu_admin_dev_only}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_only}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -XX:InitialRAMPercentage=30 -XX:MaxRAMPercentage=65
      KRIBU_DEMO_MIKE_PASSWORD: ${KRIBU_DEMO_MIKE_PASSWORD:-mike_demo_only}
      KRIBU_DEMO_HR_PASSWORD: ${KRIBU_DEMO_HR_PASSWORD:-hr_demo_only}
      KRIBU_DEMO_MANAGER_PASSWORD: ${KRIBU_DEMO_MANAGER_PASSWORD:-manager_demo_only}
      KRIBU_DEMO_EXTERNAL_PASSWORD: ${KRIBU_DEMO_EXTERNAL_PASSWORD:-external_demo_only}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: 768m
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.21.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    volumes:
      - ./policies/rego:/policies:ro
    networks: [policy_internal]
    mem_limit: 256m
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - kribu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 192m
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      KRIBU_ENVIRONMENT: development
      KRIBU_LOG_LEVEL: ${KRIBU_LOG_LEVEL:-INFO}
      KRIBU_DATABASE_URL: postgresql+asyncpg://kribu_app:${KRIBU_APP_DB_PASSWORD:-kribu_app_dev_only}@postgres:5432/${POSTGRES_DB:-kribu}
      KRIBU_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      KRIBU_OIDC_ISSUER_URL: http://localhost:${KEYCLOAK_PORT:-8180}/realms/kribu-demo
      KRIBU_OIDC_JWKS_URL: http://keycloak:8080/realms/kribu-demo/protocol/openid-connect/certs
      KRIBU_OIDC_AUDIENCE: kribu-api
      KRIBU_OIDC_CLOCK_SKEW_SECONDS: ${KRIBU_OIDC_CLOCK_SKEW_SECONDS:-30}
      KRIBU_OPA_URL: http://opa:8181
      KRIBU_OPA_TIMEOUT_SECONDS: ${KRIBU_OPA_TIMEOUT_SECONDS:-2}
      KRIBU_OPA_POLICY_VERSION: ${KRIBU_OPA_POLICY_VERSION:-guard-v2}
      KRIBU_DOCUMENT_STORE_PATH: /var/lib/kribu/documents
      KRIBU_UPLOAD_MAX_BYTES: ${KRIBU_UPLOAD_MAX_BYTES:-26214400}
      KRIBU_CELERY_BROKER_URL: redis://redis:6379/0
      KRIBU_INGESTION_OWNER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kribu}:${POSTGRES_PASSWORD:-kribu_dev_only}@postgres:5432/${POSTGRES_DB:-kribu}
      KRIBU_INGESTION_POLL_SECONDS: ${KRIBU_INGESTION_POLL_SECONDS:-15}
      KRIBU_INGESTION_TASK_TIMEOUT_SECONDS: ${KRIBU_INGESTION_TASK_TIMEOUT_SECONDS:-120}
      KRIBU_INGESTION_MAX_PDF_PAGES: ${KRIBU_INGESTION_MAX_PDF_PAGES:-250}
      KRIBU_INGESTION_MAX_CONTENT_UNITS: ${KRIBU_INGESTION_MAX_CONTENT_UNITS:-100000}
      KRIBU_MODEL_PROVIDER: ${KRIBU_MODEL_PROVIDER:-gemini}
      KRIBU_MODEL_DATA_POLICY: ${KRIBU_MODEL_DATA_POLICY:-synthetic_only}
      KRIBU_GEMINI_API_KEY: ${KRIBU_GEMINI_API_KEY:-}
      KRIBU_GEMINI_MODEL: ${KRIBU_GEMINI_MODEL:-gemini-3.8-flash}
      KRIBU_GEMINI_MAX_OUTPUT_TOKENS: ${KRIBU_GEMINI_MAX_OUTPUT_TOKENS:-4096}
      KRIBU_GEMINI_TEMPERATURE: ${KRIBU_GEMINI_TEMPERATURE:-0.1}
      KRIBU_GEMINI_TIMEOUT_SECONDS: ${KRIBU_GEMINI_TIMEOUT_SECONDS:-30}
      KRIBU_GEMINI_RETRY_ATTEMPTS: ${KRIBU_GEMINI_RETRY_ATTEMPTS:-3}
      KRIBU_EMBEDDING_PROVIDER: ${KRIBU_EMBEDDING_PROVIDER:-gemini}
      KRIBU_GEMINI_EMBEDDING_MODEL: ${KRIBU_GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      KRIBU_GEMINI_EMBEDDING_DIMENSION: ${KRIBU_GEMINI_EMBEDDING_DIMENSION:-768}
      KRIBU_GEMINI_EMBEDDING_BATCH_SIZE: ${KRIBU_GEMINI_EMBEDDING_BATCH_SIZE:-16}
      KRIBU_RETRIEVAL_CANDIDATE_LIMIT: ${KRIBU_RETRIEVAL_CANDIDATE_LIMIT:-50}
      KRIBU_RETRIEVAL_RRF_K: ${KRIBU_RETRIEVAL_RRF_K:-60}
      KRIBU_RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT: ${KRIBU_RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT:-3}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - kribu_document_store:/var/lib/kribu/documents
    networks: [default, policy_internal]
    depends_on:
      seed:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      opa:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ingestion-worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command:
      [
        "uv",
        "run",
        "--frozen",
        "--no-dev",
        "--package",
        "kribu-api",
        "celery",
        "-A",
        "app.ingestion.celery_app:celery_app",
        "worker",
        "--beat",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    environment:
      KRIBU_ENVIRONMENT: development
      KRIBU_DATABASE_URL: postgresql+asyncpg://kribu_app:${KRIBU_APP_DB_PASSWORD:-kribu_app_dev_only}@postgres:5432/${POSTGRES_DB:-kribu}
      KRIBU_INGESTION_OWNER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kribu}:${POSTGRES_PASSWORD:-kribu_dev_only}@postgres:5432/${POSTGRES_DB:-kribu}
      KRIBU_CELERY_BROKER_URL: redis://redis:6379/0
      KRIBU_DOCUMENT_STORE_PATH: /var/lib/kribu/documents
      KRIBU_INGESTION_POLL_SECONDS: ${KRIBU_INGESTION_POLL_SECONDS:-15}
      KRIBU_INGESTION_TASK_TIMEOUT_SECONDS: ${KRIBU_INGESTION_TASK_TIMEOUT_SECONDS:-120}
      KRIBU_INGESTION_MAX_PDF_PAGES: ${KRIBU_INGESTION_MAX_PDF_PAGES:-250}
      KRIBU_INGESTION_MAX_CONTENT_UNITS: ${KRIBU_INGESTION_MAX_CONTENT_UNITS:-100000}
      KRIBU_MODEL_DATA_POLICY: ${KRIBU_MODEL_DATA_POLICY:-synthetic_only}
      KRIBU_GEMINI_API_KEY: ${KRIBU_GEMINI_API_KEY:-}
      KRIBU_GEMINI_TIMEOUT_SECONDS: ${KRIBU_GEMINI_TIMEOUT_SECONDS:-30}
      KRIBU_GEMINI_RETRY_ATTEMPTS: ${KRIBU_GEMINI_RETRY_ATTEMPTS:-3}
      KRIBU_EMBEDDING_PROVIDER: ${KRIBU_EMBEDDING_PROVIDER:-gemini}
      KRIBU_GEMINI_EMBEDDING_MODEL: ${KRIBU_GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      KRIBU_GEMINI_EMBEDDING_DIMENSION: ${KRIBU_GEMINI_EMBEDDING_DIMENSION:-768}
      KRIBU_GEMINI_EMBEDDING_BATCH_SIZE: ${KRIBU_GEMINI_EMBEDDING_BATCH_SIZE:-16}
    volumes:
      - kribu_document_store:/var/lib/kribu/documents
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 1536m
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      INTERNAL_API_BASE_URL: http://api:8000/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  kribu_postgres_data:
  kribu_keycloak_postgres_data:
  kribu_document_store:
  kribu_redis_data:

networks:
  policy_internal:
    internal: true

