name: kribu

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kribu}
      POSTGRES_USER: ${POSTGRES_USER:-kribu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kribu_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kribu_postgres_data:/var/lib/postgresql
      - ./infra/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kribu} -d ${POSTGRES_DB:-kribu}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      KRIBU_ENVIRONMENT: development
      KRIBU_LOG_LEVEL: ${KRIBU_LOG_LEVEL:-INFO}
      KRIBU_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kribu}:${POSTGRES_PASSWORD:-kribu_dev_only}@postgres:5432/${POSTGRES_DB:-kribu}
      KRIBU_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}"]'
      KRIBU_MODEL_PROVIDER: ${KRIBU_MODEL_PROVIDER:-gemini}
      KRIBU_MODEL_DATA_POLICY: ${KRIBU_MODEL_DATA_POLICY:-synthetic_only}
      KRIBU_GEMINI_API_KEY: ${KRIBU_GEMINI_API_KEY:-}
      KRIBU_GEMINI_MODEL: ${KRIBU_GEMINI_MODEL:-gemini-3.8-flash}
      KRIBU_GEMINI_MAX_OUTPUT_TOKENS: ${KRIBU_GEMINI_MAX_OUTPUT_TOKENS:-4096}
      KRIBU_GEMINI_TEMPERATURE: ${KRIBU_GEMINI_TEMPERATURE:-0.1}
      KRIBU_GEMINI_TIMEOUT_SECONDS: ${KRIBU_GEMINI_TIMEOUT_SECONDS:-30}
      KRIBU_GEMINI_RETRY_ATTEMPTS: ${KRIBU_GEMINI_RETRY_ATTEMPTS:-3}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      INTERNAL_API_BASE_URL: http://api:8000/v1
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}/v1
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  kribu_postgres_data:

