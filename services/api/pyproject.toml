[project]
name = "kribu-api"
version = "0.1.0"
description = "KRIBU API control plane"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.17.2,<2",
    "asyncpg>=0.31.0,<1",
    "fastapi>=0.119.0,<1",
    "google-genai>=1.75.0,<2",
    "httpx>=0.28.1,<1",
    "pyjwt[crypto]>=2.10.1,<3",
    "pydantic-settings>=2.11.0,<3",
    "python-multipart>=0.0.18,<1",
    "sqlalchemy[asyncio]>=2.0.44,<3",
    "uvicorn[standard]>=0.37.0,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2",
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.2.0,<2",
    "ruff>=0.14.1,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL and OPA; runs only with KRIBU_INTEGRATION=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

